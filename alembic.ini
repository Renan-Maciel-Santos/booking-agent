# Alembic configuration. The database URL is NOT stored here: migrations/env.py
# reads it from environment variables through booking_agent.config.Settings.
[alembic]
# Folder containing env.py and the versions/ directory.
script_location = migrations
# Make src/ importable when running `alembic` from the project root.
prepend_sys_path = src
path_separator = os
# Timestamped, sortable revision file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Use the OS path separator for version locations.
version_path_separator = os

# Minimal logging config required by fileConfig in env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
