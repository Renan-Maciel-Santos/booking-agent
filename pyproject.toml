[project]
name = "booking-agent"
version = "0.1.0"
description = "Conversational booking agent where the LLM only parses intent and a deterministic service layer owns every business rule."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "openai>=1.50",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-docker>=7.2.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ANN", "D", "SIM", "N", "BLE", "T20", "PT", "RUF"]
# D203/D213 conflict with the Google convention chosen below.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "D"]
"migrations/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# testcontainers ships no type stubs.
[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop per session so session-scoped async fixtures work.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Make the tests package importable (for tests.fakes).
pythonpath = ["."]
addopts = "--strict-markers -ra -m 'not eval'"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that need Docker (real PostgreSQL via testcontainers)",
    "eval: opt-in evaluation suite running against real LLM providers",
]
